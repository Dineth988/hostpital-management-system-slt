# render.yaml — Deploy both services from one repo
# Push to GitHub, then connect repo in Render dashboard

services:
  # ── Backend API ───────────────────────────────────────
  - type: web
    name: hms-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: CLIENT_ORIGIN
        value: https://hms-client-rxof.onrender.com
      - key: PORT
        value: 10000

  # ── Frontend Static Site ──────────────────────────────
  - type: web
    name: hms-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://hms-api-3xmf.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
